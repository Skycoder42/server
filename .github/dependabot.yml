version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"

  - package-ecosystem: "docker"
    directory: "/docker/etebase"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
