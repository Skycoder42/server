name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test-redis:
    # Service containers only work on Linux runners, so the live-Redis
    # websocket tests run here. redis-py is pure Python, so a single OS is
    # enough to validate that functionality.
    name: test with Redis (ubuntu, python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ETEBASE_REDIS_URI: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # Running without ETEBASE_REDIS_URI: the live-Redis websocket tests
      # self-skip and test_websocket.py::test_subscription_ticket_requires_redis
      # (the no-Redis 501 path) runs instead.
      - name: Run tests
        run: python -m pytest

  lint:
    name: lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      # mypy currently reports ~54 pre-existing django-stubs errors (they
      # predate this fork's dependency bump); keep it non-blocking until
      # they are cleared, per AGENTS.md.
      - name: mypy
        run: |
          if mypy .; then
            echo "mypy passed"
          else
            echo "mypy reported errors (currently informational, see AGENTS.md)"
            exit 0
          fi

  compat:
    name: compat e2e
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - test-redis

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up driver venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Build the fork image (standard python base)
        env:
          BUILDER_IMAGE: python:3.14-alpine3.24
          RUNTIME_IMAGE: python:3.14-alpine3.24
        run: ./docker/build.sh server compat-ci

      - name: Run the compatibility suite
        env:
          ETEBASE_IMAGE_LEGACY: docker.io/victorrds/etesync:latest
          ETEBASE_IMAGE_NEW: skycoder42/etebase-server:compat-ci
        run: ./docker/compat/run_compat_test.sh --clean

  docker:
    name: Build docker image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - test-redis
      - compat
    environment: dhi.io
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag matches setup.py version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(python3 setup.py --version)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${VERSION}" != "${TAG}" ]; then
            echo "::error::setup.py version (${VERSION}) does not match the pushed tag (${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "setup.py version ${VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to dhi.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_HUB_USERNAME }}
          password: ${{ secrets.DHI_HUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: skycoder42/etebase-server
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{raw}}
            type=sha

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/etebase/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
