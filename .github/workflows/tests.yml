name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test-redis:
    # Service containers only work on Linux runners, so the live-Redis
    # websocket tests run here. redis-py is pure Python, so a single OS is
    # enough to validate that functionality.
    name: test with Redis (ubuntu, python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ETEBASE_REDIS_URI: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # Running without ETEBASE_REDIS_URI: the live-Redis websocket tests
      # self-skip and test_websocket.py::test_subscription_ticket_requires_redis
      # (the no-Redis 501 path) runs instead.
      - name: Run tests
        run: python -m pytest

  lint:
    name: lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      # mypy currently reports ~54 pre-existing django-stubs errors (they
      # predate this fork's dependency bump); keep it non-blocking until
      # they are cleared, per AGENTS.md.
      - name: mypy
        run: |
          if mypy .; then
            echo "mypy passed"
          else
            echo "mypy reported errors (currently informational, see AGENTS.md)"
            exit 0
          fi